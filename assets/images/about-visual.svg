<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ab_core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="ab_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ab_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="220" cy="160" r="140" fill="url(#ab_glow)"/>

  <!-- Orbital Geometric Rings -->
  <circle cx="220" cy="160" r="125" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="4 6"/>
  <circle cx="220" cy="160" r="90" stroke="#818cf8" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="220" cy="160" r="60" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- Connection lines to nodes -->
  <path d="M220 160 L105 75" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M220 160 L335 75" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M220 160 L95 245" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M220 160 L345 245" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Central Neural Core -->
  <circle cx="220" cy="160" r="38" fill="#0f172a" stroke="url(#ab_core)" stroke-width="2.5"/>
  <circle cx="220" cy="160" r="28" fill="#1e1b4b" fill-opacity="0.8"/>
  <!-- Central AI Spark Icon -->
  <path d="M220 144 L224 156 L236 160 L224 164 L220 176 L216 164 L204 160 L216 156 Z" fill="url(#ab_core)"/>
  <circle cx="220" cy="160" r="3" fill="#ffffff"/>

  <!-- Orbiting Satellites -->
  <circle cx="95" cy="160" r="4" fill="#38bdf8"/>
  <circle cx="345" cy="160" r="4" fill="#818cf8"/>
  <circle cx="220" cy="35" r="4" fill="#34d399"/>
  <circle cx="220" cy="285" r="4" fill="#f472b6"/>

  <!-- Floating Badge 1 (Top Left): CLIENT-SIDE -->
  <g transform="translate(30, 56)">
    <rect width="125" height="36" rx="10" fill="url(#ab_card)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="18" cy="18" r="8" fill="#0284c7" fill-opacity="0.3"/>
    <path d="M18 13 L22 15 L22 19 C22 22 18 24 18 24 C18 24 14 22 14 19 L14 15 Z" fill="#38bdf8"/>
    <text x="34" y="22" fill="#f1f5f9" font-size="10" font-family="'Courier New', monospace" font-weight="bold">CLIENT-SIDE</text>
  </g>

  <!-- Floating Badge 2 (Top Right): 10 APPS -->
  <g transform="translate(285, 56)">
    <rect width="125" height="36" rx="10" fill="url(#ab_card)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="18" cy="18" r="8" fill="#4f46e5" fill-opacity="0.3"/>
    <circle cx="18" cy="18" r="3.5" fill="#10b981"/>
    <text x="34" y="22" fill="#f1f5f9" font-size="10" font-family="'Courier New', monospace" font-weight="bold">10 APPS</text>
  </g>

  <!-- Floating Badge 3 (Bottom Left): MODULAR WEB -->
  <g transform="translate(25, 226)">
    <rect width="135" height="36" rx="10" fill="url(#ab_card)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="18" cy="18" r="8" fill="#059669" fill-opacity="0.3"/>
    <text x="18" y="22" fill="#34d399" font-size="10" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    <text x="34" y="22" fill="#f1f5f9" font-size="10" font-family="'Courier New', monospace" font-weight="bold">&lt; 200 LINES</text>
  </g>

  <!-- Floating Badge 4 (Bottom Right): MIT LICENSE -->
  <g transform="translate(280, 226)">
    <rect width="130" height="36" rx="10" fill="url(#ab_card)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="18" cy="18" r="8" fill="#d97706" fill-opacity="0.3"/>
    <text x="18" y="22" fill="#fbbf24" font-size="11" text-anchor="middle">★</text>
    <text x="34" y="22" fill="#f1f5f9" font-size="10" font-family="'Courier New', monospace" font-weight="bold">MIT LICENSE</text>
  </g>
</svg>
