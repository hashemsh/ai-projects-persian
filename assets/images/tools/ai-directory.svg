<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_aid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow_aid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#080c18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent_purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Base & Glow -->
  <rect width="360" height="170" fill="url(#bg_aid)"/>
  <circle cx="180" cy="85" r="100" fill="url(#glow_aid)"/>

  <!-- Subtle Matrix Circuit Network Lines -->
  <g opacity="0.25">
    <path d="M 40,85 L 140,85" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 220,85 L 320,85" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 180,25 L 180,60" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 180,110 L 180,145" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="40" cy="85" r="3" fill="#38bdf8"/>
    <circle cx="320" cy="85" r="3" fill="#38bdf8"/>
    <circle cx="180" cy="25" r="3" fill="#6366f1"/>
    <circle cx="180" cy="145" r="3" fill="#6366f1"/>
  </g>

  <!-- Left Model Card (e.g. LLM / Reasoning) -->
  <g transform="translate(34, 45)">
    <rect width="90" height="80" rx="10" fill="url(#card_grad)" stroke="#334155" stroke-width="1"/>
    <circle cx="26" cy="24" r="11" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.2"/>
    <path d="M22 24l3 3 5-6" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="44" y="18" width="34" height="6" rx="3" fill="#94a3b8"/>
    <rect x="44" y="28" width="22" height="4" rx="2" fill="#475569"/>
    <rect x="14" y="44" width="62" height="4" rx="2" fill="#334155"/>
    <rect x="14" y="52" width="48" height="4" rx="2" fill="#334155"/>
    <rect x="14" y="62" width="28" height="9" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="20" cy="66.5" r="2" fill="#10b981"/>
  </g>

  <!-- Right Model Card (e.g. Image / Code) -->
  <g transform="translate(236, 45)">
    <rect width="90" height="80" rx="10" fill="url(#card_grad)" stroke="#334155" stroke-width="1"/>
    <circle cx="26" cy="24" r="11" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1.2"/>
    <path d="M20 27l4-5 3 3 5-6" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="44" y="18" width="34" height="6" rx="3" fill="#94a3b8"/>
    <rect x="44" y="28" width="22" height="4" rx="2" fill="#475569"/>
    <rect x="14" y="44" width="62" height="4" rx="2" fill="#334155"/>
    <rect x="14" y="52" width="48" height="4" rx="2" fill="#334155"/>
    <rect x="14" y="62" width="32" height="9" rx="4" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="0.8"/>
    <circle cx="20" cy="66.5" r="2" fill="#06b6d4"/>
  </g>

  <!-- Central Orbital Core & Search Radar -->
  <g transform="translate(180, 85)">
    <!-- Outer Pulsing Rings -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#06b6d4" stroke-width="1.8" filter="drop-shadow(0 0 12px rgba(6,182,212,0.4))"/>

    <!-- Central AI Neural Diamond / Brain Icon -->
    <path d="M 0,-14 L 12,-3 L 0,8 L -12,-3 Z" fill="url(#accent_cyan)"/>
    <circle cx="0" cy="-3" r="3.5" fill="#ffffff"/>

    <!-- Orbiting Nodes -->
    <g transform="rotate(45)">
      <circle cx="32" cy="0" r="4.5" fill="#f43f5e"/>
      <circle cx="-32" cy="0" r="4" fill="#10b981"/>
    </g>
    <g transform="rotate(-40)">
      <circle cx="0" cy="32" r="4.5" fill="#a855f7"/>
      <circle cx="0" cy="-32" r="3.5" fill="#38bdf8"/>
    </g>

    <!-- Floating Magnifier Search Badge -->
    <g transform="translate(12, 14)">
      <circle cx="8" cy="8" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/>
      <circle cx="6.5" cy="6.5" r="4" stroke="#38bdf8" stroke-width="1.4" fill="none"/>
      <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bottom Label Bar -->
  <g transform="translate(110, 146)">
    <rect width="140" height="16" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="70" y="11.5" fill="#94a3b8" font-family="'Vazirmatn', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">AI MODELS DIRECTORY</text>
  </g>
</svg>
