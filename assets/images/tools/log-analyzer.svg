<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_log" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow_log" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="term_head" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badge_pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="ai_spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background & Ambient Glow -->
  <rect width="360" height="170" fill="url(#bg_log)"/>
  <circle cx="180" cy="85" r="95" fill="url(#glow_log)"/>

  <!-- Left: Stylized Server Rack -->
  <g transform="translate(36, 32)">
    <!-- Rack frame -->
    <rect width="70" height="106" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <!-- Blade 1 -->
    <rect x="6" y="8" width="58" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <circle cx="14" cy="18" r="2.5" fill="#10b981"/>
    <circle cx="22" cy="18" r="2.5" fill="#06b6d4"/>
    <line x1="32" y1="18" x2="56" y2="18" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
    
    <!-- Blade 2 (with Error alert) -->
    <rect x="6" y="34" width="58" height="20" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <circle cx="14" cy="44" r="2.5" fill="#f43f5e"/>
    <circle cx="22" cy="44" r="2.5" fill="#f59e0b"/>
    <line x1="32" y1="44" x2="56" y2="44" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
    
    <!-- Blade 3 -->
    <rect x="6" y="60" width="58" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <circle cx="14" cy="70" r="2.5" fill="#10b981"/>
    <circle cx="22" cy="70" r="2.5" fill="#10b981"/>
    <line x1="32" y1="70" x2="56" y2="70" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>

    <!-- Bottom rack grill -->
    <line x1="12" y1="92" x2="58" y2="92" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="12" y1="97" x2="58" y2="97" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Center Diagnostic Stream Cable -->
  <g transform="translate(106, 85)">
    <path d="M 0,-10 C 20,-10 25,0 45,0" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="22" cy="-5" r="3" fill="#f43f5e" opacity="0.8"/>
  </g>

  <!-- Right: Terminal & AI Log Analysis Window -->
  <g transform="translate(150, 24)">
    <!-- Terminal window body -->
    <rect width="175" height="122" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1.2"/>
    <!-- Terminal Titlebar -->
    <path d="M 0,10 C 0,4.48 4.48,0 10,0 L 165,0 C 170.52,0 175,4.48 175,10 L 175,22 L 0,22 Z" fill="url(#term_head)"/>
    <line x1="0" y1="22" x2="175" y2="22" stroke="#1e293b" stroke-width="1"/>
    <!-- Window buttons -->
    <circle cx="12" cy="11" r="3" fill="#f43f5e"/>
    <circle cx="22" cy="11" r="3" fill="#f59e0b"/>
    <circle cx="32" cy="11" r="3" fill="#10b981"/>
    <text x="50" y="14" fill="#94a3b8" font-size="8" font-family="monospace">error.log • AI Debugger</text>

    <!-- Terminal code lines -->
    <!-- Line 1: Timestamp & error -->
    <text x="12" y="38" fill="#64748b" font-size="7.5" font-family="monospace">[2026-11-23 02:30:14]</text>
    <rect x="12" y="44" width="151" height="18" rx="4" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="16" y="56" fill="#fb7185" font-size="7.5" font-family="monospace" font-weight="bold">FATAL: 502 Bad Gateway Nginx</text>

    <!-- Line 2: Stacktrace snippet -->
    <text x="12" y="74" fill="#94a3b8" font-size="7" font-family="monospace">connect() failed (111: Refused)</text>
    <text x="12" y="86" fill="#64748b" font-size="7" font-family="monospace">while connecting to upstream php-fpm</text>

    <!-- Bottom: AI Solution Pulse Card -->
    <rect x="12" y="94" width="151" height="20" rx="5" fill="url(#ai_spark)" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <g transform="translate(20, 104)">
      <!-- AI Star / Brain glyph -->
      <path d="M 0,-4 L 1.2,-1.2 L 4,0 L 1.2,1.2 L 0,4 L -1.2,1.2 L -4,0 L -1.2,-1.2 Z" fill="#38bdf8"/>
    </g>
    <text x="30" y="107" fill="#e0f2fe" font-size="8" font-family="monospace" font-weight="bold">AI Fix: systemctl restart php-fpm</text>
  </g>
</svg>
