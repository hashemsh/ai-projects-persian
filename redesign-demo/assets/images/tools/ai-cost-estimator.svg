<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1205"/>
      <stop offset="100%" stop-color="#2b1a07"/>
    </linearGradient>
    <radialGradient id="glow_cost" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="170" fill="url(#bg_cost)"/>
  <circle cx="180" cy="85" r="90" fill="url(#glow_cost)"/>
  <!-- Central Glass Card -->
  <rect x="70" y="25" width="220" height="120" rx="16" fill="#241405" fill-opacity="0.8" stroke="#d97706" stroke-width="1.2"/>
  <!-- AI Neural Processor Chip -->
  <g transform="translate(130, 85)">
    <!-- Radiating Bus Pins -->
    <path d="M-28 -12 L-36 -12 M-28 0 L-36 0 M-28 12 L-36 12" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 -12 L36 -12 M28 0 L36 0 M28 12 L36 12" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M-12 -28 L-12 -36 M0 -28 L0 -36 M12 -28 L12 -36" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M-12 28 L-12 36 M0 28 L0 36 M12 28 L12 36" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Chip Body -->
    <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Neural Core Spark -->
    <circle cx="0" cy="0" r="12" fill="#78350f"/>
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fbbf24"/>
  </g>
  <!-- Exchange Indicator & Token Symbols -->
  <g transform="translate(195, 58)">
    <rect x="0" y="0" width="60" height="24" rx="6" fill="#451a03" stroke="#b45309" stroke-width="0.8"/>
    <text x="30" y="16.5" fill="#fde68a" font-size="11" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">$ ⇄ ﷼</text>
    <rect x="0" y="30" width="60" height="24" rx="6" fill="#451a03" stroke="#b45309" stroke-width="0.8"/>
    <text x="30" y="46.5" fill="#34d399" font-size="11" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">1K TOK</text>
  </g>
</svg>
