      <stop offset="0%" stop-color="#140a20"/>
      <stop offset="100%" stop-color="#221033"/>
    </linearGradient>
    <radialGradient id="glow_ph" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="170" fill="url(#bg_ph)"/>
  <circle cx="180" cy="85" r="90" fill="url(#glow_ph)"/>
  <!-- Central Glass Card -->
  <rect x="70" y="25" width="220" height="120" rx="16" fill="#1b0d2b" fill-opacity="0.8" stroke="#7e22ce" stroke-width="1.2"/>
