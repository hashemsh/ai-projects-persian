<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_qr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061812"/>
      <stop offset="100%" stop-color="#0b241c"/>
    </linearGradient>
    <radialGradient id="glow_qr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laser_line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="360" height="170" fill="url(#bg_qr)"/>
  <circle cx="180" cy="85" r="90" fill="url(#glow_qr)"/>
  <!-- Central Glass Card -->
  <rect x="70" y="25" width="220" height="120" rx="16" fill="#0d241d" fill-opacity="0.75" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Target Framing Corner Brackets -->
  <path d="M125 45 L115 45 L115 55" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M235 45 L245 45 L245 55" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M115 115 L115 125 L125 125" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M245 115 L245 125 L235 125" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- QR Code Matrix Elements -->
  <!-- Top-Left Finder -->
  <rect x="135" y="52" width="22" height="22" rx="5" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <rect x="141" y="58" width="10" height="10" rx="2" fill="#34d399"/>
  <!-- Top-Right Finder -->
  <rect x="203" y="52" width="22" height="22" rx="5" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <rect x="209" y="58" width="10" height="10" rx="2" fill="#34d399"/>
  <!-- Bottom-Left Finder -->
  <rect x="135" y="96" width="22" height="22" rx="5" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <rect x="141" y="102" width="10" height="10" rx="2" fill="#34d399"/>
  <!-- Minimal Data Pixels -->
  <g fill="#6ee7b7">
    <rect x="167" y="54" width="6" height="6" rx="1.5"/>
    <rect x="177" y="54" width="6" height="6" rx="1.5"/>
    <rect x="187" y="54" width="6" height="6" rx="1.5"/>
    <rect x="167" y="66" width="6" height="6" rx="1.5"/>
    <rect x="187" y="66" width="6" height="6" rx="1.5"/>
    <rect x="167" y="78" width="6" height="6" rx="1.5"/>
    <rect x="177" y="78" width="6" height="6" rx="1.5"/>
    <rect x="187" y="78" width="6" height="6" rx="1.5"/>
    <rect x="135" y="82" width="6" height="6" rx="1.5"/>
    <rect x="145" y="82" width="6" height="6" rx="1.5"/>
    <rect x="177" y="90" width="6" height="6" rx="1.5"/>
    <rect x="167" y="102" width="6" height="6" rx="1.5"/>
    <rect x="187" y="102" width="6" height="6" rx="1.5"/>
    <rect x="203" y="90" width="6" height="6" rx="1.5"/>
    <rect x="215" y="90" width="6" height="6" rx="1.5"/>
    <rect x="203" y="102" width="6" height="6" rx="1.5"/>
    <rect x="215" y="112" width="6" height="6" rx="1.5"/>
  </g>
  <!-- Glowing Laser Scan Line -->
  <rect x="110" y="84" width="140" height="2" fill="url(#laser_line)"/>
  <circle cx="180" cy="85" r="3" fill="#ffffff"/>
</svg>
