<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_regex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120d24"/>
      <stop offset="100%" stop-color="#1c1338"/>
    </linearGradient>
    <radialGradient id="glow_regex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="170" fill="url(#bg_regex)"/>
  <circle cx="180" cy="85" r="90" fill="url(#glow_regex)"/>
  <!-- Central Glass Card -->
  <rect x="70" y="25" width="220" height="120" rx="16" fill="#181130" fill-opacity="0.8" stroke="#4c1d95" stroke-width="1.2"/>
  <!-- Window Dots -->
  <circle cx="92" cy="42" r="3.5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="104" cy="42" r="3.5" fill="#eab308" opacity="0.8"/>
  <circle cx="116" cy="42" r="3.5" fill="#10b981" opacity="0.8"/>
  <!-- Central Code Brackets & Pattern -->
  <g transform="translate(180, 75)" text-anchor="middle">
    <!-- Outer Decorative Code Brackets -->
    <text x="-65" y="10" fill="#a78bfa" font-size="28" font-family="'Courier New', monospace" font-weight="900">{</text>
    <text x="65" y="10" fill="#a78bfa" font-size="28" font-family="'Courier New', monospace" font-weight="900">}</text>
    <!-- Code Badges -->
    <g transform="translate(-40, -12)">
      <rect x="0" y="0" width="36" height="22" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
      <text x="18" y="15" fill="#c084fc" font-size="11" font-family="'Courier New', monospace" font-weight="bold">.*</text>
    </g>
    <g transform="translate(4, -12)">
      <rect x="0" y="0" width="36" height="22" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="18" y="15" fill="#6ee7b7" font-size="11" font-family="'Courier New', monospace" font-weight="bold">\d+</text>
    </g>
  </g>
  <!-- Match Wave & Status Dot -->
  <g transform="translate(95, 112)">
    <path d="M0 8 Q25 -2 50 8 T100 8 T140 8" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="8" r="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
    <path d="M147 8 L149 10 L154 6" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
