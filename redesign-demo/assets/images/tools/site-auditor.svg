<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_auditor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061814"/>
      <stop offset="100%" stop-color="#0c2620"/>
    </linearGradient>
    <radialGradient id="glow_auditor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="170" fill="url(#bg_auditor)"/>
  <circle cx="180" cy="85" r="90" fill="url(#glow_auditor)"/>
  <!-- Central Glass Card -->
  <rect x="70" y="25" width="220" height="120" rx="16" fill="#0c241e" fill-opacity="0.8" stroke="#059669" stroke-width="1.2"/>
  <!-- Left Side: Circular Speedometer 100% -->
  <g transform="translate(130, 85)">
    <!-- Base Track -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#064e3b" stroke-width="6"/>
    <!-- Active Sweep 100% -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="165 35" stroke-linecap="round"/>
    <text x="0" y="6" fill="#34d399" font-size="18" font-family="'Courier New', monospace" font-weight="900" text-anchor="middle">100</text>
  </g>
  <!-- Right Side: Metrics (Shield & Lightning) -->
  <g transform="translate(195, 55)">
    <!-- Shield Box -->
    <rect x="0" y="0" width="60" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <!-- Shield Icon -->
    <path d="M18 7 L26 10 L26 16 C26 21 18 23 18 23 C18 23 10 21 10 16 L10 10 Z" fill="#10b981" opacity="0.3" stroke="#34d399" stroke-width="1.2"/>
    <path d="M15 15 L17 17 L22 12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="19" fill="#a7f3d0" font-size="11" font-family="'Courier New', monospace" font-weight="bold">SSL</text>
    <!-- Lightning Box (Speed) -->
    <rect x="0" y="34" width="60" height="28" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <path d="M18 41 L14 48 L18 48 L17 55 L23 47 L19 47 Z" fill="#38bdf8"/>
    <text x="36" y="53" fill="#bae6fd" font-size="11" font-family="'Courier New', monospace" font-weight="bold">CWV</text>
  </g>
</svg>
