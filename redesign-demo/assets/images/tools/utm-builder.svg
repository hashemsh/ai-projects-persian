<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_utm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0d1c"/>
      <stop offset="100%" stop-color="#291228"/>
    </linearGradient>
    <radialGradient id="glow_utm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar_grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="360" height="170" fill="url(#bg_utm)"/>
  <circle cx="180" cy="85" r="90" fill="url(#glow_utm)"/>
  <!-- Central Glass Card -->
  <rect x="70" y="25" width="220" height="120" rx="16" fill="#200d20" fill-opacity="0.8" stroke="#be185d" stroke-width="1.2"/>
  <!-- Left Side: Marketing Target Bullseye -->
  <g transform="translate(130, 85)">
    <circle cx="0" cy="0" r="30" fill="#831843" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="20" fill="#9d174d" fill-opacity="0.3" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="#be185d" stroke="#fbcfe8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
  <!-- Connection Arrow / Track -->
  <path d="M165 85 L185 85" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <!-- Right Side: Rising Analytics Bar Chart -->
  <g transform="translate(195, 52)">
    <rect x="0" y="46" width="10" height="20" rx="3" fill="#831843"/>
    <rect x="15" y="32" width="10" height="34" rx="3" fill="#be185d"/>
    <rect x="30" y="18" width="10" height="48" rx="3" fill="url(#bar_grad)"/>
    <rect x="45" y="4" width="10" height="62" rx="3" fill="#f472b6"/>
    <!-- Trending line across tops -->
    <path d="M5 44 L20 30 L35 16 L50 2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="2" r="3" fill="#38bdf8"/>
  </g>
</svg>
