<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_webp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081824"/>
      <stop offset="100%" stop-color="#0d2538"/>
    </linearGradient>
    <radialGradient id="glow_webp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystal_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="360" height="170" fill="url(#bg_webp)"/>
  <circle cx="180" cy="85" r="90" fill="url(#glow_webp)"/>
  <!-- Central Glass Card -->
  <rect x="70" y="25" width="220" height="120" rx="16" fill="#0c2333" fill-opacity="0.75" stroke="#164e63" stroke-width="1.2"/>
  <!-- Left Side: Generic Image Canvas -->
  <g transform="translate(100, 52)">
    <rect width="52" height="66" rx="8" fill="#132f42" stroke="#1e4e6e" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="5" fill="#f59e0b" opacity="0.8"/>
    <path d="M8 54 L20 38 L30 48 L40 34 L48 54 Z" fill="#38bdf8" fill-opacity="0.4"/>
  </g>
  <!-- Center: Conversion Pulsing Arrow -->
  <g transform="translate(180, 85)">
    <circle cx="0" cy="0" r="16" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M-6 0 L6 0 M2 -5 L7 0 L2 5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Right Side: Optimized WebP Crystal Gem -->
  <g transform="translate(215, 52)">
    <rect width="52" height="66" rx="8" fill="url(#crystal_grad)" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
    <!-- Faceted Gem / Crystal -->
    <path d="M26 20 L38 28 L34 44 L26 50 L18 44 L14 28 Z" fill="#06b6d4" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2"/>
    <path d="M14 28 L38 28 M26 20 L26 50 M18 44 L26 28 L34 44" stroke="#e0f2fe" stroke-width="0.8" opacity="0.8"/>
    <!-- Micro Sparkle -->
    <circle cx="38" cy="18" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
