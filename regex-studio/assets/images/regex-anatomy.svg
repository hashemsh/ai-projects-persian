<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f1d" />
      <stop offset="100%" stop-color="#141933" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="860" height="300" rx="20" fill="url(#bgGrad)" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Code Display Box -->
  <rect x="40" y="80" width="800" height="90" rx="14" fill="#070913" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Regex Parts in Code Box -->
  <!-- Delimiter 1 -->
  <text x="70" y="138" font-family="Courier New, monospace" font-size="34" font-weight="bold" fill="#64748b">/</text>
  <!-- Anchor Start -->
  <text x="95" y="138" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#38bdf8">^</text>
  <!-- Group 1 -->
  <text x="120" y="138" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#a855f7">(?:\+98|0)?</text>
  <!-- Main Match -->
  <text x="320" y="138" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#34d399">9</text>
  <text x="345" y="138" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#fbbf24">\d</text>
  <text x="385" y="138" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#f472b6">{9}</text>
  <!-- Anchor End -->
  <text x="445" y="138" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#38bdf8">$</text>
  <!-- Delimiter 2 -->
  <text x="470" y="138" font-family="Courier New, monospace" font-size="34" font-weight="bold" fill="#64748b">/</text>
  <!-- Flags -->
  <text x="495" y="138" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#f97316">gmu</text>

  <!-- Title Badge -->
  <g transform="translate(40, 36)">
    <rect width="210" height="30" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3" />
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">آناتومی ساختار عبارت منظم (Regex)</text>
  </g>

  <!-- Annotations / Callouts -->
  <!-- Callout 1: Anchor Start -->
  <path d="M 102 80 L 102 52" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="102" cy="52" r="3" fill="#38bdf8"/>
  <text x="102" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">شروع رشته (^)</text>

  <!-- Callout 2: Non-capturing group -->
  <path d="M 220 170 L 220 215" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="220" cy="215" r="3" fill="#a855f7"/>
  <text x="220" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#d8b4fe" text-anchor="middle">گروه غیراخذکننده اختیاری</text>
  <text x="220" y="252" font-family="Courier New, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">(?:+98|0)?</text>

  <!-- Callout 3: Digit quantifier -->
  <path d="M 395 170 L 395 215" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="395" cy="215" r="3" fill="#f472b6"/>
  <text x="395" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#fbcfe8" text-anchor="middle">تکرارگر ۹ رقمی</text>
  <text x="395" y="252" font-family="Courier New, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">\d{9}</text>

  <!-- Callout 4: Anchor End -->
  <path d="M 452 80 L 452 52" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="452" cy="52" r="3" fill="#38bdf8"/>
  <text x="452" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">پایان رشته ($)</text>

  <!-- Callout 5: Flags -->
  <path d="M 525 170 L 525 215" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="525" cy="215" r="3" fill="#f97316"/>
  <text x="525" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#fed7aa" text-anchor="middle">پرچم‌ها (Flags)</text>
  <text x="525" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">سراسری، چندخطی، یونیکد</text>

  <!-- Legend in right side -->
  <g transform="translate(620, 95)">
    <rect width="200" height="175" rx="10" fill="#0c0f1d" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="100" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">راهنمای رنگی المان‌ها</text>
    <circle cx="20" cy="50" r="5" fill="#38bdf8" />
    <text x="35" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">لنگرها (Anchors)</text>
    <circle cx="20" cy="78" r="5" fill="#a855f7" />
    <text x="35" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">گروه‌ها (Groups)</text>
    <circle cx="20" cy="106" r="5" fill="#fbbf24" />
    <text x="35" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">کلاس کاراکتر (\d)</text>
    <circle cx="20" cy="134" r="5" fill="#f472b6" />
    <text x="35" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">تکرارگرها (Quantifiers)</text>
    <circle cx="20" cy="160" r="5" fill="#f97316" />
    <text x="35" y="164" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">فلگ‌ها (Flags)</text>
  </g>
</svg>
