<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0c0f1d"/>
      <stop offset="100%" stop-color="#111528"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glowCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="glowPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="glowEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glass Fill -->
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171c34" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1426" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>

    <filter id="neonEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" rx="24" fill="url(#bgCanvas)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="540" y1="0" x2="540" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
  </g>

  <!-- Title & Subtitle Header -->
  <text x="450" y="45" font-family="'Vazirmatn', sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle">
    معماری جریان داده‌های ساختاریافته (JSON-LD Schema Architecture)
  </text>
  <text x="450" y="70" font-family="'Vazirmatn', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    از تولید کد در وب‌سایت تا پردازش توسط خزنده‌ها و نمایش ریچ اسنیپت در موتورهای جستجو و هوش مصنوعی
  </text>

  <!-- STEP 1: Web Page Source (JSON-LD Script) -->
  <g transform="translate(40, 110)" filter="url(#boxShadow)">
    <rect width="230" height="290" rx="18" fill="url(#cardFill)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="42" rx="18" fill="rgba(6, 182, 212, 0.12)"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="21" r="5" fill="#10b981"/>
    <text x="140" y="26" font-family="'Vazirmatn', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">۱. تزریق کدهای JSON-LD</text>

    <!-- Code Block Inside -->
    <rect x="15" y="55" width="200" height="170" rx="10" fill="#070913" stroke="rgba(255,255,255,0.06)"/>
    <text x="25" y="80" font-family="monospace" font-size="10.5" fill="#06b6d4">&lt;script type="ld+json"&gt;</text>
    <text x="35" y="102" font-family="monospace" font-size="10" fill="#e2e8f0">{</text>
    <text x="45" y="122" font-family="monospace" font-size="10" fill="#a5b4fc">"@context": "schema.org",</text>
    <text x="45" y="142" font-family="monospace" font-size="10" fill="#38bdf8">"@type": "Product",</text>
    <text x="45" y="162" font-family="monospace" font-size="10" fill="#f472b6">"name": "محصول...",</text>
    <text x="45" y="182" font-family="monospace" font-size="10" fill="#34d399">"aggregateRating": {...}</text>
    <text x="35" y="202" font-family="monospace" font-size="10" fill="#e2e8f0">}</text>
    <text x="25" y="220" font-family="monospace" font-size="10.5" fill="#06b6d4">&lt;/script&gt;</text>

    <!-- Caption -->
    <text x="115" y="250" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">بدون تغییر در لایه‌های HTML</text>
    <text x="115" y="270" font-family="'Vazirmatn', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">مستقل از قالب و طراحی UI</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(285, 235)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="url(#glowCyan)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" filter="url(#neonCyan)"/>
    <polygon points="45,-6 57,0 45,6" fill="#06b6d4"/>
    <text x="25" y="-14" font-family="'Vazirmatn', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">خزش و تحلیل</text>
  </g>

  <!-- STEP 2: Processing Engines (Googlebot & AI Models) -->
  <g transform="translate(350, 110)" filter="url(#boxShadow)">
    <rect width="200" height="290" rx="18" fill="url(#cardFill)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="42" rx="18" fill="rgba(99, 102, 241, 0.12)"/>
    <text x="100" y="26" font-family="'Vazirmatn', sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">۲. خزنده‌ها و مدل‌های AI</text>

    <!-- Engine 1: Googlebot -->
    <g transform="translate(18, 58)">
      <rect width="164" height="65" rx="12" fill="#070913" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="28" cy="32" r="14" fill="rgba(66, 133, 244, 0.15)"/>
      <text x="28" y="37" font-family="'Vazirmatn', sans-serif" font-size="14" fill="#60a5fa" text-anchor="middle">🔍</text>
      <text x="50" y="28" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Googlebot Search</text>
      <text x="50" y="44" font-family="'Vazirmatn', sans-serif" font-size="9" fill="#94a3b8">استخراج داده‌های ساختاریافته</text>
    </g>

    <!-- Engine 2: AI & LLMs -->
    <g transform="translate(18, 135)">
      <rect width="164" height="65" rx="12" fill="#070913" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="28" cy="32" r="14" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="28" y="37" font-family="'Vazirmatn', sans-serif" font-size="14" fill="#c084fc" text-anchor="middle">🤖</text>
      <text x="50" y="28" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="700" fill="#ffffff">مدل‌های هوش مصنوعی</text>
      <text x="50" y="44" font-family="'Vazirmatn', sans-serif" font-size="9" fill="#94a3b8">SearchGPT, Perplexity &amp; GEO</text>
    </g>

    <!-- Engine 3: Knowledge Graph -->
    <g transform="translate(18, 212)">
      <rect width="164" height="60" rx="12" fill="#070913" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="28" cy="30" r="14" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="28" y="35" font-family="'Vazirmatn', sans-serif" font-size="14" fill="#34d399" text-anchor="middle">🕸️</text>
      <text x="50" y="26" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="700" fill="#ffffff">گراف دانش گوگل</text>
      <text x="50" y="42" font-family="'Vazirmatn', sans-serif" font-size="9" fill="#94a3b8">ارتباط هویت برند و محتوا</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(565, 235)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="url(#glowEmerald)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" filter="url(#neonEmerald)"/>
    <polygon points="45,-6 57,0 45,6" fill="#10b981"/>
    <text x="25" y="-14" font-family="'Vazirmatn', sans-serif" font-size="10" fill="#34d399" text-anchor="middle">تولید اسنیپت</text>
  </g>

  <!-- STEP 3: Rich Snippets & SERP Display -->
  <g transform="translate(630, 110)" filter="url(#boxShadow)">
    <rect width="230" height="290" rx="18" fill="url(#cardFill)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="42" rx="18" fill="rgba(16, 185, 129, 0.12)"/>
    <text x="115" y="26" font-family="'Vazirmatn', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">۳. نتایج غنی (Google SERP)</text>

    <!-- Simulated Rich Result Card -->
    <g transform="translate(15, 55)">
      <rect width="200" height="175" rx="12" fill="#070913" stroke="rgba(255,255,255,0.08)"/>

      <!-- Breadcrumbs -->
      <text x="15" y="22" font-family="'Vazirmatn', sans-serif" font-size="10" fill="#94a3b8">example.com › محصولات › کالا</text>

      <!-- Headline -->
      <text x="15" y="42" font-family="'Vazirmatn', sans-serif" font-size="12.5" font-weight="700" fill="#60a5fa">گوشی موبایل گلکسی اولترا</text>

      <!-- Rating Stars & Price -->
      <g transform="translate(15, 52)">
        <text x="0" y="14" font-size="12" fill="#f59e0b">★★★★★</text>
        <text x="75" y="14" font-family="'Vazirmatn', sans-serif" font-size="10" font-weight="700" fill="#f59e0b">۴.۸ (۱۴۲)</text>
      </g>
      <text x="15" y="84" font-family="'Vazirmatn', sans-serif" font-size="10.5" font-weight="700" fill="#10b981">۶۴,۹۰۰,۰۰۰ تومان • موجود در انبار</text>

      <!-- Description Snippet -->
      <text x="15" y="104" font-family="'Vazirmatn', sans-serif" font-size="9.5" fill="#cbd5e1">مجهز به پردازنده قدرتمند و دوربین ۲۰۰</text>
      <text x="15" y="118" font-family="'Vazirmatn', sans-serif" font-size="9.5" fill="#cbd5e1">مگاپیکسلی با هوش مصنوعی مولد...</text>

      <!-- FAQ Accordion Pill -->
      <rect x="12" y="130" width="176" height="32" rx="6" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.2)"/>
      <text x="22" y="150" font-family="'Vazirmatn', sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">▾ آیا گارانتی معتبر شرکتی دارد؟</text>
    </g>

    <!-- Value Metric -->
    <text x="115" y="252" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">افزایش تا ۳۵٪ نرخ کلیک (CTR)</text>
    <text x="115" y="270" font-family="'Vazirmatn', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">جلب اعتماد و تسخیر فضای سرپ</text>
  </g>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(450, 442)">
    <text x="0" y="0" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
      طراحی و پیاده‌سازی بر اساس استانداردهای رسمی W3C Schema.org و Google Search Central
    </text>
  </g>
</svg>
