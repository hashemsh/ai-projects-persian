<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f1d" />
      <stop offset="100%" stop-color="#141933" />
    </linearGradient>
    <linearGradient id="webpBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="jpegBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="pngBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="880" height="340" rx="20" fill="url(#cardBg)" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(40, 35)">
    <rect width="320" height="32" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
    <text x="160" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">مقایسه عملکردی حجم و کیفیت فرمت WebP با رقبا</text>
  </g>

  <!-- Format 1: PNG -->
  <g transform="translate(50, 95)">
    <rect width="180" height="150" rx="14" fill="#070913" stroke="#ef4444" stroke-opacity="0.25" stroke-width="1" />
    <text x="90" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f87171" text-anchor="middle">فرمت PNG</text>
    <text x="90" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Lossless (بدون افت)</text>
    <rect x="25" y="70" width="130" height="12" rx="6" fill="#1e293b" />
    <rect x="25" y="70" width="130" height="12" rx="6" fill="url(#pngBar)" />
    <text x="90" y="112" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2,450 KB</text>
    <text x="90" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">حجم پایه (۱۰۰٪)</text>
  </g>

  <!-- Format 2: JPEG -->
  <g transform="translate(250, 95)">
    <rect width="180" height="150" rx="14" fill="#070913" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1" />
    <text x="90" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">فرمت JPEG / JPG</text>
    <text x="90" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Lossy (با افت جزئی)</text>
    <rect x="25" y="70" width="130" height="12" rx="6" fill="#1e293b" />
    <rect x="25" y="70" width="75" height="12" rx="6" fill="url(#jpegBar)" />
    <text x="90" y="112" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1,200 KB</text>
    <text x="90" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">کاهش ۵۱٪ نسبت به PNG</text>
  </g>

  <!-- Format 3: WebP (The Winner!) -->
  <g transform="translate(450, 85)">
    <rect width="210" height="170" rx="16" fill="#070913" stroke="#10b981" stroke-width="2" />
    <g transform="translate(145, 10)">
      <rect width="55" height="20" rx="6" fill="#10b981" />
      <text x="27" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">بهترین</text>
    </g>
    <text x="105" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#34d399" text-anchor="middle">فرمت مدرن WebP</text>
    <text x="105" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">پشتیبانی از شفافیت و انیمیشن</text>
    <rect x="25" y="76" width="160" height="14" rx="7" fill="#1e293b" />
    <rect x="25" y="76" width="35" height="14" rx="7" fill="url(#webpBar)" />
    <text x="105" y="122" font-family="Courier New, monospace" font-size="26" font-weight="black" fill="#34d399" text-anchor="middle">310 KB</text>
    <text x="105" y="146" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">۸۷٪ صرفه‌جویی در ترافیک ⚡</text>
  </g>

  <!-- Right Side Benefits Info Panel -->
  <g transform="translate(680, 85)">
    <rect width="180" height="170" rx="14" fill="#070913" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="90" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">مزایای اختصاصی WebP</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✓ پشتیبانی از کانال آلفا (شفافیت)</text>
    <text x="20" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✓ ارتقای شدید Core Web Vitals</text>
    <text x="20" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✓ افزایش سرعت لود LCP تا ۳ برابر</text>
    <text x="20" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✓ سازگاری ۹۷٪ مرورگرهای دنیا</text>
  </g>

  <!-- Browser Support Badges in Footer -->
  <g transform="translate(50, 275)">
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">پشتیبانی کامل در تمام مرورگرهای مدرن:</text>
    <g transform="translate(230, 2)">
      <rect width="90" height="28" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="45" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Chrome 32+</text>
    </g>
    <g transform="translate(330, 2)">
      <rect width="90" height="28" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="45" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Firefox 65+</text>
    </g>
    <g transform="translate(430, 2)">
      <rect width="90" height="28" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="45" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Safari 14+</text>
    </g>
    <g transform="translate(530, 2)">
      <rect width="90" height="28" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="45" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Edge 18+</text>
    </g>
    <g transform="translate(630, 2)">
      <rect width="180" height="28" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
      <text x="90" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">۱۰۰٪ بدون ارسال به سرور 🔒</text>
    </g>
  </g>
</svg>
